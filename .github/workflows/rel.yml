name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: dependencies
        run: go mod download

      - name: windows exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          go build -ldflags "-s -w -X main.version=${VERSION}" -o payload-generator.exe .

      - name: upload build
        uses: actions/upload-artifact@v4
        with:
          name: payload-generator
          path: payload-generator.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: payload-generator.exe
          generate_release_notes: false